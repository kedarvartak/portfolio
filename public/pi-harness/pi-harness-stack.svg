<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Where Pi differentiates</title>
  <desc id="desc">A hand-drawn stack of Pi's four differentiators: model optionality, tool discipline, workflow surface, and session memory.</desc>
  <defs>
    <filter id="rough" x="-4%" y="-5%" width="108%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.011 0.05" numOctaves="2" seed="31" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1.5 Q6 4.5 10 6.5 Q6 8.5 1 11" fill="none" stroke="#1e1e1e" stroke-width="1.5" stroke-linecap="round"/></marker>
    <style>
      .hand{font-family:"Comic Sans MS","Segoe Print","Bradley Hand",cursive;fill:#1e1e1e}.title{font-size:42px;font-weight:700}.label{font-size:29px;font-weight:700}.note{font-size:20px}
      .shape{stroke:#1e1e1e;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;filter:url(#rough)}.echo{fill:none;stroke:#1e1e1e;stroke-width:1.1;opacity:.4;stroke-linecap:round}.arrow{fill:none;stroke:#1e1e1e;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow);filter:url(#rough)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fffdf7"/>
  <text x="72" y="72" class="hand title">Where Pi differentiates</text>
  <path d="M72 85 Q286 89 500 83" fill="none" stroke="#868e96" stroke-width="2.2" stroke-linecap="round" filter="url(#rough)"/>

  <g>
    <path d="M174 130 Q163 131 162 143 L160 203 Q161 216 174 217 L1026 215 Q1039 215 1040 202 L1038 143 Q1037 131 1025 130Z" fill="#a5d8ff" class="shape"/>
    <path d="M177 135 L1022 134 Q1033 135 1034 145 L1034 199 Q1033 210 1022 211 L177 212 Q166 210 166 200 L167 146 Q167 138 177 135Z" class="echo"/>
    <text x="208" y="180" class="hand label">1. Model optionality</text><text x="575" y="179" class="hand note">Anthropic, OpenAI, Gemini, Bedrock, local gateways…</text>
  </g>
  <path d="M600 217 Q596 232 601 243" class="arrow"/>
  <g>
    <path d="M174 246 Q163 247 162 259 L160 319 Q161 332 174 333 L1026 331 Q1039 331 1040 318 L1038 259 Q1037 247 1025 246Z" fill="#b2f2bb" class="shape"/>
    <path d="M177 251 L1022 250 Q1033 251 1034 261 L1034 315 Q1033 326 1022 327 L177 328 Q166 326 166 316 L167 262 Q167 254 177 251Z" class="echo"/>
    <text x="208" y="296" class="hand label">2. Tool discipline</text><text x="575" y="295" class="hand note">small built-ins, exact edits, visible bash / read / write</text>
  </g>
  <path d="M600 333 Q604 347 599 359" class="arrow"/>
  <g>
    <path d="M174 362 Q163 363 162 375 L160 435 Q161 448 174 449 L1026 447 Q1039 447 1040 434 L1038 375 Q1037 363 1025 362Z" fill="#eebefa" class="shape"/>
    <path d="M177 367 L1022 366 Q1033 367 1034 377 L1034 431 Q1033 442 1022 443 L177 444 Q166 442 166 432 L167 378 Q167 370 177 367Z" class="echo"/>
    <text x="208" y="412" class="hand label">3. Workflow surface</text><text x="575" y="411" class="hand note">extensions, skills, prompts, themes, shared packages</text>
  </g>
  <path d="M600 449 Q596 463 601 475" class="arrow"/>
  <g>
    <path d="M174 478 Q163 479 162 491 L160 551 Q161 564 174 565 L1026 563 Q1039 563 1040 550 L1038 491 Q1037 479 1025 478Z" fill="#ffd8a8" class="shape"/>
    <path d="M177 483 L1022 482 Q1033 483 1034 493 L1034 547 Q1033 558 1022 559 L177 560 Q166 558 166 548 L167 494 Q167 486 177 483Z" class="echo"/>
    <text x="208" y="528" class="hand label">4. Session memory</text><text x="575" y="527" class="hand note">JSONL tree, branch / fork / clone, compaction, export</text>
  </g>

  <path d="M260 624 Q249 625 248 637 L247 690 Q248 703 261 704 L940 702 Q953 702 954 689 L952 637 Q951 625 939 624Z" fill="#ffec99" stroke="#e67700" class="shape"/>
  <path d="M266 629 L934 628 Q946 629 947 639 L947 686 Q946 697 935 698 L266 699 Q255 697 255 687 L256 640 Q256 632 266 629Z" stroke="#e67700" class="echo"/>
  <text x="292" y="672" class="hand label">Result: the harness adapts to the team, not vice versa.</text>
</svg>
