<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <style>
    .txt{font-family:"Comic Sans MS","Virgil",cursive;fill:#0f172a;font-size:30px}.small{font-size:21px;fill:#334155}.layer{stroke:#0f172a;stroke-width:4;rx:24}.arrow{stroke:#0f172a;stroke-width:5;fill:none;marker-end:url(#arrow);stroke-linecap:round}.note{fill:#fef3c7;stroke:#92400e;stroke-width:3;rx:18}</style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#0f172a" stroke-width="2"/></marker></defs>
  <text x="72" y="72" class="txt" font-size="42">Where Pi differentiates</text>

  <rect x="160" y="130" width="880" height="86" class="layer" fill="#dbeafe"/>
  <text x="210" y="181" class="txt">1. Model optionality</text><text x="590" y="181" class="txt small">Anthropic, OpenAI, Gemini, Bedrock, local gateways...</text>
  <rect x="160" y="245" width="880" height="86" class="layer" fill="#dcfce7"/>
  <text x="210" y="296" class="txt">2. Tool discipline</text><text x="590" y="296" class="txt small">small built-ins, exact edits, visible bash/read/write</text>
  <rect x="160" y="360" width="880" height="86" class="layer" fill="#fae8ff"/>
  <text x="210" y="411" class="txt">3. Workflow surface</text><text x="590" y="411" class="txt small">extensions, skills, prompts, themes, package sharing</text>
  <rect x="160" y="475" width="880" height="86" class="layer" fill="#ffedd5"/>
  <text x="210" y="526" class="txt">4. Session memory</text><text x="590" y="526" class="txt small">JSONL tree, branch/fork/clone, compaction, export</text>

  <path d="M600 216 L600 245" class="arrow"/><path d="M600 331 L600 360" class="arrow"/><path d="M600 446 L600 475" class="arrow"/>
  <rect x="245" y="620" width="710" height="78" class="note"/>
  <text x="290" y="667" class="txt">Result: the harness adapts to the team, not vice versa.</text>
</svg>
