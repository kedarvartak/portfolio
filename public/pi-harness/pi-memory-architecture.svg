<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Pi memory: append-only history, compacted context</title>
  <desc id="desc">A hand-drawn diagram showing Pi retaining a complete JSONL session tree while compacting older entries into the model's working context.</desc>
  <defs>
    <filter id="rough" x="-5%" y="-6%" width="110%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="2" seed="23" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9.5" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1.2 Q5.5 4.2 9.5 6 Q5.7 8 1.2 10.8" fill="none" stroke="#1e1e1e" stroke-width="1.5" stroke-linecap="round"/></marker>
    <style>
      .hand{font-family:"Comic Sans MS","Segoe Print","Bradley Hand",cursive;fill:#1e1e1e}.title{font-size:40px;font-weight:700}.label{font-size:27px;font-weight:700}.note{font-size:19px}.tiny{font-size:18px}
      .shape{stroke:#1e1e1e;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round;filter:url(#rough)}.echo{fill:none;stroke:#1e1e1e;stroke-width:1.05;opacity:.4;stroke-linecap:round}.line{fill:none;stroke:#1e1e1e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow);filter:url(#rough)}.thin{stroke-width:2.4}.dash{stroke-dasharray:10 8}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fffdf7"/>
  <text x="72" y="68" class="hand title">Pi memory: full history, compacted context</text>
  <path d="M72 82 Q390 87 708 81" fill="none" stroke="#868e96" stroke-width="2.2" stroke-linecap="round" filter="url(#rough)"/>

  <g>
    <path d="M96 118 Q84 119 83 132 L81 217 Q82 230 96 231 L1104 229 Q1118 229 1119 215 L1117 132 Q1116 119 1103 118Z" fill="#ffffff" class="shape"/>
    <path d="M101 124 L1099 123 Q1111 124 1112 135 L1112 211 Q1111 223 1099 224 L101 225 Q89 223 89 212 L90 136 Q90 127 101 124Z" class="echo"/>
    <text x="119" y="163" class="hand label">Session JSONL tree</text>
    <text x="406" y="161" class="hand tiny">id / parentId link user, assistant, tool, model, label, and compaction entries</text>
    <text x="119" y="202" class="hand note">The complete trail stays on disk—even when the model sees a compressed working set.</text>
  </g>

  <text x="91" y="278" class="hand tiny">older history</text>
  <text x="820" y="278" class="hand tiny">high-fidelity recent context</text>
  <g>
    <path d="M103 296 Q96 297 96 306 L96 367 Q97 376 106 377 L244 375 Q253 374 254 365 L253 306 Q252 297 243 296Z" fill="#ffffff" class="shape"/><text x="130" y="342" class="hand note">old turn</text>
    <path d="M278 296 Q271 297 271 306 L271 367 Q272 376 281 377 L419 375 Q428 374 429 365 L428 306 Q427 297 418 296Z" fill="#ffffff" class="shape"/><text x="320" y="342" class="hand note">tools</text>
    <path d="M453 296 Q446 297 446 306 L446 367 Q447 376 456 377 L594 375 Q603 374 604 365 L603 306 Q602 297 593 296Z" fill="#ffffff" class="shape"/><text x="478" y="342" class="hand note">decision</text>
    <path d="M628 296 Q621 297 621 306 L621 367 Q622 376 631 377 L769 375 Q778 374 779 365 L778 306 Q777 297 768 296Z" fill="#b2f2bb" class="shape"/><text x="661" y="330" class="hand note">recent</text><text x="660" y="357" class="hand tiny">~20k kept</text>
    <path d="M803 296 Q796 297 796 306 L796 367 Q797 376 806 377 L944 375 Q953 374 954 365 L953 306 Q952 297 943 296Z" fill="#b2f2bb" class="shape"/><text x="833" y="342" class="hand note">current</text>
    <path d="M978 296 Q971 297 971 306 L971 367 Q972 376 981 377 L1080 375 Q1089 374 1090 365 L1089 306 Q1088 297 1079 296Z" fill="#a5d8ff" class="shape"/><text x="997" y="342" class="hand note">reply</text>
  </g>
  <path d="M255 336 L269 336" class="line thin"/><path d="M430 336 L444 336" class="line thin"/><path d="M605 336 L619 336" class="line thin"/><path d="M780 336 L794 336" class="line thin"/><path d="M955 336 L969 336" class="line thin"/>

  <path d="M177 378 C180 438 324 453 392 459" class="line"/>
  <path d="M517 378 C512 421 459 444 414 460" class="line"/>
  <g>
    <path d="M255 463 Q246 465 246 475 L245 548 Q246 558 257 559 L542 557 Q553 556 554 546 L552 475 Q551 464 541 463Z" fill="#ffec99" stroke="#e67700" class="shape"/>
    <text x="286" y="501" class="hand label">CompactionEntry</text><text x="282" y="535" class="hand tiny">summary + firstKeptEntryId</text>
  </g>
  <path d="M555 510 C672 565 862 549 895 378" class="line"/>

  <g>
    <path d="M97 597 Q88 599 88 609 L88 680 Q89 691 100 692 L514 690 Q525 689 526 678 L524 608 Q523 598 513 597Z" fill="#ffe3e3" stroke="#c92a2a" class="shape dash"/>
    <text x="120" y="634" class="hand label">Not sent every turn ≠ deleted</text><text x="119" y="669" class="hand tiny">Old entries remain inspectable, branchable, exportable.</text>
  </g>
  <g>
    <path d="M674 597 Q665 599 665 609 L665 680 Q666 691 677 692 L1091 690 Q1102 689 1103 678 L1101 608 Q1100 598 1090 597Z" fill="#a5d8ff" stroke="#1971c2" class="shape"/>
    <text x="694" y="632" class="hand tiny">Model context = system + summary + kept recent messages</text><text x="694" y="666" class="hand tiny">Reserved tokens leave room for the next answer.</text>
  </g>
</svg>
