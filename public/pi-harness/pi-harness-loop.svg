<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fffaf0"/>
  <style>
    .box{fill:#ffffff;stroke:#1f2937;stroke-width:4;rx:22;filter:url(#shadow)}
    .dash{fill:#f8fafc;stroke:#64748b;stroke-width:3;stroke-dasharray:10 10;rx:20}
    .txt{font-family:"Comic Sans MS","Virgil",cursive;font-size:32px;fill:#111827}
    .small{font-size:22px;fill:#374151}
    .arrow{stroke:#111827;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .accent{fill:#dbeafe;stroke:#2563eb;stroke-width:4;rx:18}
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#111827" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#111827" stroke-width="2"/></marker>
  </defs>

  <text x="70" y="70" class="txt" font-size="40">Pi harness: tiny core, huge surface area</text>
  <rect x="80" y="135" width="235" height="115" class="box"/>
  <text x="127" y="182" class="txt">Intent</text>
  <text x="112" y="216" class="txt small">plain-language task</text>

  <path d="M315 193 C380 160, 410 160, 475 193" class="arrow"/>

  <rect x="475" y="120" width="255" height="145" class="accent"/>
  <text x="535" y="171" class="txt">Pi</text>
  <text x="515" y="205" class="txt small">read · edit · bash · write</text>
  <text x="515" y="235" class="txt small">sessions · context · models</text>

  <path d="M730 193 C805 160, 835 160, 910 193" class="arrow"/>

  <rect x="910" y="135" width="220" height="115" class="box"/>
  <text x="968" y="182" class="txt">Code</text>
  <text x="950" y="216" class="txt small">verified diff</text>

  <rect x="110" y="395" width="260" height="140" class="dash"/>
  <text x="148" y="444" class="txt">Extensions</text>
  <text x="145" y="480" class="txt small">tools, commands, UI</text>

  <rect x="470" y="395" width="260" height="140" class="dash"/>
  <text x="523" y="444" class="txt">Skills</text>
  <text x="508" y="480" class="txt small">repeatable know-how</text>

  <rect x="830" y="395" width="260" height="140" class="dash"/>
  <text x="867" y="444" class="txt">Packages</text>
  <text x="875" y="480" class="txt small">shareable workflow</text>

  <path d="M240 395 C280 320, 450 290, 545 264" class="arrow"/>
  <path d="M600 395 C605 340, 605 310, 605 265" class="arrow"/>
  <path d="M960 395 C900 325, 760 290, 660 265" class="arrow"/>

  <path d="M1000 250 C980 620, 240 620, 195 250" class="arrow"/>
  <text x="430" y="650" class="txt small">observe → branch → compact → continue without losing the trail</text>
</svg>
